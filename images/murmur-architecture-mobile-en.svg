<svg xmlns="http://www.w3.org/2000/svg" width="420" height="930" viewBox="0 0 420 930" role="img" aria-labelledby="title"><title id="title">MurMur · Voice to text</title><rect width="420" height="930" rx="18" fill="#101726"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="24" y="37" fill="#eef3ff" font-size="22" font-weight="600">MurMur · Voice to text</text><text x="24" y="63" fill="#aab9d6" font-size="14">One Session owns the whole trip.</text><rect x="24" y="86" width="372" height="104" rx="12" fill="#1e2b43" stroke="#425778"/><text x="42" y="115" fill="#eef3ff" font-size="19" font-weight="600">01  Keys / Session</text><text x="42" y="141" fill="#becce3" font-size="15">pynput + Qt</text><text x="42" y="167" fill="#becce3" font-size="15">ID · cancel · configuration snapshot</text><path d="M210 195v14m-5 -5l5 5 5 -5" stroke="#aab9d6" stroke-width="2" fill="none"/><rect x="24" y="214" width="372" height="104" rx="12" fill="#1e2b43" stroke="#425778"/><text x="42" y="243" fill="#eef3ff" font-size="19" font-weight="600">02  Microphone</text><text x="42" y="269" fill="#becce3" font-size="15">sounddevice · PCM</text><text x="42" y="295" fill="#becce3" font-size="15">16 kHz / mono / signed int16</text><path d="M210 323v14m-5 -5l5 5 5 -5" stroke="#aab9d6" stroke-width="2" fill="none"/><rect x="24" y="342" width="372" height="104" rx="12" fill="#1e2b43" stroke="#425778"/><text x="42" y="371" fill="#eef3ff" font-size="19" font-weight="600">03  Speech recognition</text><text x="42" y="397" fill="#becce3" font-size="15">Local models / cloud service</text><text x="42" y="423" fill="#becce3" font-size="15">Raw transcript</text><path d="M210 451v14m-5 -5l5 5 5 -5" stroke="#aab9d6" stroke-width="2" fill="none"/><rect x="24" y="470" width="372" height="104" rx="12" fill="#1e2b43" stroke="#425778"/><text x="42" y="499" fill="#eef3ff" font-size="19" font-weight="600">04  Text processing</text><text x="42" y="525" fill="#becce3" font-size="15">Ollama / external endpoint</text><text x="42" y="551" fill="#becce3" font-size="15">Refine · translate · Ask Anything</text><path d="M210 579v14m-5 -5l5 5 5 -5" stroke="#aab9d6" stroke-width="2" fill="none"/><rect x="24" y="598" width="372" height="104" rx="12" fill="#1e2b43" stroke="#425778"/><text x="42" y="627" fill="#eef3ff" font-size="19" font-weight="600">05  Desktop delivery</text><text x="42" y="653" fill="#becce3" font-size="15">Recheck the original target</text><text x="42" y="679" fill="#becce3" font-size="15">Paste when valid, otherwise preview</text><rect x="24" y="744" width="372" height="162" rx="12" fill="#172235" stroke="#425778"/><text x="40" y="773" fill="#b9c7ff" font-size="17">Local ASR</text><text x="40" y="799" fill="#becce3" font-size="14">sherpa CPU / isolated ONNX + GGUF</text><text x="40" y="825" fill="#becce3" font-size="14">GPU: DirectML + Vulkan · VAD: CPU</text><text x="40" y="851" fill="#becce3" font-size="14">No automatic cloud fallback</text><text x="40" y="877" fill="#becce3" font-size="14">SQLite keeps raw + final + context</text></g></svg>